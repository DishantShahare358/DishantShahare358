  <rect x="30" y="148" width="116" height="3.5" rx="2" fill="#bfdbfe"/>
  <rect x="30" y="148" width="0" height="3.5" rx="2" fill="#0284c7">
    <animate attributeName="width" from="0" to="116" dur="1s" begin="0.40s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </rect>
</g>

