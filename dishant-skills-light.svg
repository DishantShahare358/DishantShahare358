<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-label="Dishant Shahare Skills">
<defs><style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes popCell{0%{opacity:0;transform:translateY(16px) scale(.85)}70%{opacity:1;transform:translateY(-3px) scale(1.03)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes rankGlow{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes shineX{0%{transform:translateX(-200px) skewX(-15deg)}60%,100%{transform:translateX(960px) skewX(-15deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pillFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.cell{opacity:0;animation:popCell .55s cubic-bezier(.2,.8,.3,1.2) forwards;transform-box:fill-box;transform-origin:center}
.rk{animation:rankGlow 2.2s ease-in-out infinite}
.sh{animation:shineX 6s ease-in-out 2s infinite}
.pill{opacity:0;animation:fadeUp .4s ease forwards}
.pf{animation:pillFloat 3s ease-in-out infinite}
]]></style>
<linearGradient id="tgL" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#0284c7;#2563eb;#0369a1;#0284c7" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#2563eb;#0369a1;#0284c7;#2563eb" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="shgL" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".3"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="tcL"><rect x="0" y="0" width="860" height="520" rx="14"/></clipPath>
</defs>

<!-- Background -->
<rect x="1" y="1" width="858" height="518" rx="14" fill="#f0f6ff" stroke="url(#tgL)" stroke-width="1.5"/>

<!-- Title -->
<text x="30" y="38" font-size="18" font-weight="bold" fill="url(#tgL)">🛠️ Skills</text>

