<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 282" width="420" height="282" role="img" aria-label="Dishant Shahare core languages">
<defs><style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shineX{0%{transform:translateX(-140px)}60%,100%{transform:translateX(460px)}}
.row{opacity:0;animation:fadeUp .5s ease forwards}
.sh{animation:shineX 4s ease-in-out 2.2s infinite}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#00d4ff;#3b82f6;#00bcd4;#00d4ff" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#3b82f6;#00bcd4;#00d4ff;#3b82f6" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cardc"><rect x="1" y="1" width="418" height="280" rx="14"/></clipPath>
<clipPath id="stackc"><rect x="20" y="52" width="0" height="10" rx="5"><animate attributeName="width" from="0" to="380" dur="1.4s" begin=".4s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/></rect></clipPath>
</defs>
<!-- Card Container -->
<rect x="1" y="1" width="418" height="280" rx="14" fill="#0b1528" stroke="url(#tg)" stroke-width="1.5"/>
<text x="20" y="32" font-size="15" font-weight="bold" fill="url(#tg)">📊 Top Languages</text>

<!-- Top Stacked Bar (Multi-color inner contents) -->
<g clip-path="url(#stackc)">
  <rect x="20" y="52" width="133" height="10" fill="#38bdf8"/>
  <rect x="153" y="52" width="114" height="10" fill="#4ade80"/>
  <rect x="267" y="52" width="76" height="10" fill="#fde047"/>
  <rect x="343" y="52" width="38" height="10" fill="#f97316"/>
  <rect x="381" y="52" width="19" height="10" fill="#c084fc"/>
</g>

<!-- Row 1: Python -->
<g class="row" style="animation-delay:0.70s">
  <circle cx="26" cy="82" r="4.5" fill="#38bdf8"/>
  <text x="38" y="86" font-size="12" fill="#e6edf3" font-weight="bold">Python</text>
  <text x="396" y="86" text-anchor="end" font-size="12" fill="#38bdf8" font-weight="bold">35%</text>
  <rect x="38" y="93" width="358" height="7" rx="3.5" fill="#14233c"/>
  <rect class="bar" x="38" y="93" width="125.3" height="7" rx="3.5" fill="#38bdf8">
    <animate attributeName="width" from="0" to="125.3" dur="1.1s" begin="0.85s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- Row 2: Flutter -->
<g class="row" style="animation-delay:1.00s">
  <circle cx="26" cy="120" r="4.5" fill="#4ade80"/>
  <text x="38" y="124" font-size="12" fill="#e6edf3" font-weight="bold">Flutter</text>
  <text x="396" y="124" text-anchor="end" font-size="12" fill="#4ade80" font-weight="bold">30%</text>
  <rect x="38" y="131" width="358" height="7" rx="3.5" fill="#14233c"/>
  <rect class="bar" x="38" y="131" width="107.4" height="7" rx="3.5" fill="#4ade80">
    <animate attributeName="width" from="0" to="107.4" dur="1.1s" begin="1.15s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- Row 3: Dart -->
<g class="row" style="animation-delay:1.30s">
  <circle cx="26" cy="158" r="4.5" fill="#fde047"/>
  <text x="38" y="162" font-size="12" fill="#e6edf3" font-weight="bold">Dart</text>
  <text x="396" y="162" text-anchor="end" font-size="12" fill="#fde047" font-weight="bold">20%</text>
  <rect x="38" y="169" width="358" height="7" rx="3.5" fill="#14233c"/>
  <rect class="bar" x="38" y="169" width="71.6" height="7" rx="3.5" fill="#fde047">
    <animate attributeName="width" from="0" to="71.6" dur="1.1s" begin="1.45s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- Row 4: JavaScript -->
<g class="row" style="animation-delay:1.60s">
  <circle cx="26" cy="196" r="4.5" fill="#f97316"/>
  <text x="38" y="200" font-size="12" fill="#e6edf3" font-weight="bold">JavaScript</text>
  <text x="396" y="200" text-anchor="end" font-size="12" fill="#f97316" font-weight="bold">10%</text>
  <rect x="38" y="207" width="358" height="7" rx="3.5" fill="#14233c"/>
  <rect class="bar" x="38" y="207" width="35.8" height="7" rx="3.5" fill="#f97316">
    <animate attributeName="width" from="0" to="35.8" dur="1.1s" begin="1.75s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- Row 5: C/C++ -->
<g class="row" style="animation-delay:1.90s">
  <circle cx="26" cy="234" r="4.5" fill="#c084fc"/>
  <text x="38" y="238" font-size="12" fill="#e6edf3" font-weight="bold">C/C++</text>
  <text x="396" y="238" text-anchor="end" font-size="12" fill="#c084fc" font-weight="bold">5%</text>
  <rect x="38" y="245" width="358" height="7" rx="3.5" fill="#14233c"/>
  <rect class="bar" x="38" y="245" width="17.9" height="7" rx="3.5" fill="#c084fc">
    <animate attributeName="width" from="0" to="20.0" dur="1.1s" begin="2.05s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- Shimmer overlay -->
<g clip-path="url(#cardc)"><rect class="sh" x="0" y="0" width="100" height="282" fill="url(#shg)" transform="skewX(-15)"/></g>
</svg>
