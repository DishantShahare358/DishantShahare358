name: "Snake: Custom Neon Theme"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate base snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Apply custom neon theme
        run: |
          python3 - << 'PYEOF'
          import re, os

          CYAN   = '#00d4ff'
          PURPLE = '#6c63ff'
          TEAL   = '#00bcd4'

          CFG = {
              'dark': {
                  'snake_old': '#39d353',
                  'bg': '#0d1117',
                  'other_dots': [        # L3→L0: vivid → barely visible gradient
                      ('#26a641', '#5258d0'),   # L3 – bright indigo
                      ('#006d32', '#3140a0'),   # L2 – medium blue-purple
                      ('#0e4429', '#1e2a60'),   # L1 – dark indigo
                      ('#161b22', '#111828'),   # L0 – barely visible on dark bg
                  ],
              },
              'light': {
                  'snake_old': '#216e39',
                  'bg': '#f0f6ff',
                  'other_dots': [        # L3→L0: rich → barely tinted gradient
                      ('#30a14e', '#6060c8'),   # L3 – rich purple
                      ('#40c463', '#8090e5'),   # L2 – medium purple-blue
                      ('#9be9a8', '#afc4f8'),   # L1 – soft blue
                      ('#ebedf0', '#dce8ff'),   # L0 – barely tinted
                  ],
              },
          }

          # ─────────────────────────────────────────────────────────────
          # Step 1: Replace OLD snake color → CYAN everywhere in the SVG
          # (covers <style> keyframes AND inline fill attrs on snake rects)
          # This keeps animation keyframe structure 100% intact.
          # ─────────────────────────────────────────────────────────────
          def step1_snake_to_cyan(svg, old):
              return svg.replace(old, CYAN).replace(old.upper(), CYAN)

          # ─────────────────────────────────────────────────────────────
          # Step 2: L4 dots now have fill="#00d4ff" (from step 1).
          # They have NO class= attr (only snake parts have class in snk).
          # Change classless cyan rects → PURPLE, outside <style> only.
          # ─────────────────────────────────────────────────────────────
          def step2_l4_dots_to_purple(svg):
              def patch(m):
                  tag = m.group(0)
                  if 'class=' not in tag and f'fill="{CYAN}"' in tag:
                      return tag.replace(f'fill="{CYAN}"', f'fill="{PURPLE}"')
                  return tag
              parts = re.split(r'(<style\b[^>]*>.*?</style>)',
                               svg, flags=re.DOTALL)
              out = []
              for p in parts:
                  if p.lower().startswith('<style'):
                      out.append(p)           # never touch CSS
                  else:
                      out.append(re.sub(r'<rect\b[^>]*/>', patch,
                                        p, flags=re.DOTALL))
              return ''.join(out)

          # ─────────────────────────────────────────────────────────────
          # Step 3: Remap other dot levels (L1-L3, L0) outside <style>
          # ─────────────────────────────────────────────────────────────
          def step3_other_dots(svg, dot_map):
              parts = re.split(r'(<style\b[^>]*>.*?</style>)',
                               svg, flags=re.DOTALL)
              out = []
              for p in parts:
                  if p.lower().startswith('<style'):
                      out.append(p)
                  else:
                      for old, new in dot_map:
                          p = p.replace(old, new).replace(old.upper(), new)
                      out.append(p)
              return ''.join(out)

          # ─────────────────────────────────────────────────────────────
          # Step 4: Parse viewBox (snk y offset is usually -10)
          # ─────────────────────────────────────────────────────────────
          def get_vp(svg):
              m = re.search(r'viewBox\s*=\s*"([^"]+)"', svg)
              if m:
                  x, y, w, h = map(float, m.group(1).split())
              else:
                  wm = re.search(r'width="(\d+)"', svg)
                  hm = re.search(r'height="(\d+)"', svg)
                  x, y, w, h = 0.0, 0.0, 830.0, 200.0
                  if wm: w = float(wm.group(1))
                  if hm: h = float(hm.group(1))
              return x, y, w, h

          # ─────────────────────────────────────────────────────────────
          # Step 5: Build overlay (background, filters, border, accents)
          # ─────────────────────────────────────────────────────────────
          def make_overlay(x, y, w, h, bg):
              x2, y2 = x+w, y+h
              cx,  cy = x+w/2, y+h/2
              bx,  by = x+1.5, y+1.5
              bw,  bh = w-3,   h-3
              tl = (x+12,  y+12);   tr = (x2-12, y+12)
              bl = (x+12,  y2-12);  br = (x2-12, y2-12)
              lx, ly = cx, y2-10
              return f"""
            <defs>
              <filter id="snake-neon" x="-15%" y="-15%" width="130%" height="130%"
                      color-interpolation-filters="sRGB">
                <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="b1"/>
                <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="b2"/>
                <feColorMatrix in="b1" type="matrix" result="c1"
                  values="0 0 0 0 0  .83 0 0 0 .83  0 0 1 0 1  0 0 0 1.2 0"/>
                <feColorMatrix in="b2" type="matrix" result="c2"
                  values="0 0 0 0 0  .83 0 0 0 .83  0 0 1 0 1  0 0 0 0.8 0"/>
                <feMerge>
                  <feMergeNode in="c2"/><feMergeNode in="c1"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
              <filter id="dot-glow" x="-20%" y="-20%" width="140%" height="140%"
                      color-interpolation-filters="sRGB">
                <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="b"/>
                <feColorMatrix in="b" type="matrix" result="cb"
                  values=".42 0 0 0 .27  .39 0 0 0 .25  0 0 1 0 1  0 0 0 1.0 0"/>
                <feMerge>
                  <feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
              <linearGradient id="bdr" gradientUnits="userSpaceOnUse"
                  x1="{x}" y1="{y}" x2="{x2}" y2="{y2}">
                <stop offset="0%"   stop-color="{CYAN}"/>
                <stop offset="35%"  stop-color="{PURPLE}"/>
                <stop offset="65%"  stop-color="{TEAL}"/>
                <stop offset="100%" stop-color="{CYAN}"/>
                <animateTransform attributeName="gradientTransform" type="rotate"
                  from="0 {cx} {cy}" to="360 {cx} {cy}"
                  dur="6s" repeatCount="indefinite"/>
              </linearGradient>
              <pattern id="scan" x="0" y="0" width="9999" height="4"
                       patternUnits="userSpaceOnUse">
                <rect x="0" y="0" width="9999" height="1" fill="rgba(0,212,255,0.04)"/>
              </pattern>
            </defs>
            <rect x="{x}" y="{y}" width="{w}" height="{h}" fill="{bg}"/>
            <rect x="{x}" y="{y}" width="{w}" height="{h}" fill="url(#scan)"/>
            <rect x="{bx}" y="{by}" width="{bw}" height="{bh}"
                  fill="none" stroke="url(#bdr)" stroke-width="2.5"/>
            <rect x="{bx+3}" y="{by+3}" width="{bw-6}" height="{bh-6}"
                  fill="none" stroke="{CYAN}" stroke-width="0.5" opacity="0.2"/>
            <path d="M {tl[0]-6} {tl[1]+6} L {tl[0]-6} {tl[1]-6} L {tl[0]+6} {tl[1]-6}"
                  fill="none" stroke="{CYAN}" stroke-width="1.8" opacity="0.85"/>
            <path d="M {tr[0]+6} {tr[1]+6} L {tr[0]+6} {tr[1]-6} L {tr[0]-6} {tr[1]-6}"
                  fill="none" stroke="{PURPLE}" stroke-width="1.8" opacity="0.85"/>
            <path d="M {bl[0]-6} {bl[1]-6} L {bl[0]-6} {bl[1]+6} L {bl[0]+6} {bl[1]+6}"
                  fill="none" stroke="{PURPLE}" stroke-width="1.8" opacity="0.85"/>
            <path d="M {br[0]+6} {br[1]-6} L {br[0]+6} {br[1]+6} L {br[0]-6} {br[1]+6}"
                  fill="none" stroke="{CYAN}" stroke-width="1.8" opacity="0.85"/>
            <circle cx="{tl[0]}" cy="{tl[1]}" r="4" fill="{CYAN}">
              <animate attributeName="opacity" values="1;0.15;1" dur="1.8s" repeatCount="indefinite"/>
              <animate attributeName="r" values="4;5.5;4" dur="1.8s" repeatCount="indefinite"/>
            </circle>
            <circle cx="{tr[0]}" cy="{tr[1]}" r="4" fill="{PURPLE}">
              <animate attributeName="opacity" values="0.15;1;0.15" dur="1.8s" repeatCount="indefinite"/>
              <animate attributeName="r" values="4;5.5;4" dur="1.8s" repeatCount="indefinite"/>
            </circle>
            <circle cx="{bl[0]}" cy="{bl[1]}" r="4" fill="{PURPLE}">
              <animate attributeName="opacity" values="1;0.15;1" dur="2.4s" repeatCount="indefinite"/>
            </circle>
            <circle cx="{br[0]}" cy="{br[1]}" r="4" fill="{CYAN}">
              <animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" repeatCount="indefinite"/>
            </circle>
            <rect x="{lx-115}" y="{ly-13}" width="230" height="17"
                  rx="8" fill="{CYAN}" opacity="0.12"/>
            <text x="{lx}" y="{ly+1}" text-anchor="middle"
                  font-family="'Courier New',Courier,monospace" font-size="9.5"
                  fill="{CYAN}" opacity="0.8" letter-spacing="1.2">
              ◈ dishantshahare · github contributions ◈
            </text>"""

          # ─────────────────────────────────────────────────────────────
          # Step 6: Attach glow filters — FIXED tag manipulation.
          # BUG in previous versions: rstrip('/') doesn't strip '/>'
          # because rstrip stops at '>' first.  Use tag[:-2] instead.
          # ─────────────────────────────────────────────────────────────
          def step6_add_glows(svg):
              def patch(m):
                  tag = m.group(0)
                  if 'filter=' in tag:
                      return tag            # already has filter, skip

                  has_class  = 'class=' in tag
                  has_purple = f'fill="{PURPLE}"' in tag

                  if not has_class and not has_purple:
                      return tag            # not a snake or max-dot element

                  # CORRECT self-closing tag strip: use index, not rstrip
                  if tag.endswith('/>'):
                      base = tag[:-2].rstrip()   # remove '/>'
                  elif tag.endswith('>'):
                      base = tag[:-1].rstrip()   # remove '>'
                  else:
                      return tag

                  if has_class:
                      return base + ' filter="url(#snake-neon)"/>'
                  else:
                      return base + ' filter="url(#dot-glow)"/>'

              # Only process outside <style> blocks (no regex on CSS)
              parts = re.split(r'(<style\b[^>]*>.*?</style>)',
                               svg, flags=re.DOTALL)
              out = []
              for p in parts:
                  if p.lower().startswith('<style'):
                      out.append(p)
                  else:
                      out.append(re.sub(r'<(?:rect|circle)\b[^>]*/>', patch,
                                        p, flags=re.DOTALL))
              return ''.join(out)

          # ─────────────────────────────────────────────────────────────
          # Main pipeline
          # ─────────────────────────────────────────────────────────────
          def process(path, mode):
              if not os.path.exists(path):
                  print(f'  SKIP: {path}'); return
              c   = CFG[mode]
              svg = open(path, encoding='utf-8').read()

              svg = step1_snake_to_cyan(svg, c['snake_old'])   # snake → cyan everywhere
              svg = step2_l4_dots_to_purple(svg)               # classless cyan rect → purple
              svg = step3_other_dots(svg, c['other_dots'])     # L1-L3 dot colors

              x, y, w, h = get_vp(svg)
              print(f'  {path}: vp x={x} y={y} w={w} h={h}')

              svg = re.sub(r'(<svg\b[^>]*>)',
                           r'\1\n' + make_overlay(x, y, w, h, c['bg']),
                           svg, count=1)

              svg = step6_add_glows(svg)

              open(path, 'w', encoding='utf-8').write(svg)
              print(f'  OK: {path}')

          process('dist/github-snake-dark.svg', 'dark')
          process('dist/github-snake.svg',      'light')
          print('All done!')
          PYEOF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
